<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Isochrone de grúa — Connect Colombia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --navy: #001D3D; --orange: #F15A2B; --turquoise: #279bb0; --yellow: #ffb000;
    --bg: #f7f8fa; --card-bg: #ffffff; --text: #1a2433; --text-muted: #5b6b80; --border: #e3e7ed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--navy) 0%, #013a63 100%);
    color: white; padding: 18px 24px;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 12.5px; color: #cfe0ee; }

  .layout { display: flex; height: calc(100vh - 68px); }
  #map { flex: 1; }

  .panel {
    width: 300px; padding: 18px; background: var(--card-bg); border-right: 1px solid var(--border);
    overflow-y: auto; flex-shrink: 0;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  .field input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 14px;
  }
  .btn {
    width: 100%; padding: 11px; border: none; border-radius: 8px; background: var(--orange); color: white;
    font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 6px;
  }
  .btn:hover { opacity: 0.92; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .status { margin-top: 12px; font-size: 12.5px; color: var(--text-muted); min-height: 18px; }
  .status.error { color: #c0392b; }
  .status.ok { color: #2e7d32; }

  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .preset-btn {
    font-size: 11px; padding: 6px 10px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--bg); cursor: pointer; color: var(--text);
  }
  .preset-btn:hover { border-color: var(--orange); color: var(--orange); }

  .base-list { display: flex; flex-direction: column; gap: 8px; }
  .base-row {
    display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg);
  }
  .base-row .swatch { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .base-row .info { flex: 1; min-width: 0; }
  .base-row .info .name { font-size: 12.5px; font-weight: 600; }
  .base-row .info .coords { font-size: 10.5px; color: var(--text-muted); }
  .base-row .info .coords input {
    width: 46%; padding: 3px 5px; font-size: 11px; border: 1px solid var(--border); border-radius: 5px;
  }
  .base-row .remove { cursor: pointer; color: var(--text-muted); font-size: 14px; padding: 2px 6px; }
  .base-row .remove:hover { color: #c0392b; }

  .legend {
    margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted);
  }
  .config-toggle { font-size: 11px; color: var(--text-muted); cursor: pointer; margin-top: 16px; text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>🗺️ Isochrone de grúa — 50 min</h1>
  <p>Connect Colombia · División Road</p>
</header>

<div class="layout">
  <div class="panel">

    <div class="field">
      <label>Bases a mostrar</label>
      <div class="base-list" id="baseList"></div>
      <button class="preset-btn" id="addCustomBtn" style="margin-top:8px;">+ Agregar base personalizada</button>
    </div>

    <div class="field">
      <label for="duration">Duración (minutos, aplica a todas)</label>
      <input type="number" id="duration" value="50">
    </div>

    <button class="btn" id="generar">Generar isochrone(s)</button>
    <div class="status" id="status"></div>

    <div class="legend">
      El polígono muestra el área que la grúa puede alcanzar en el tiempo indicado, según tráfico en vivo (TRAFFIC_AWARE). Recuerda: el resultado cambia según la hora real en la que generes el mapa.
    </div>

    <div class="config-toggle" id="toggleConfig">⚙️ Configurar URL del webhook</div>
    <div class="field" id="webhookField" style="display:none; margin-top:8px;">
      <label for="webhookUrl">URL del webhook n8n</label>
      <input type="text" id="webhookUrl" placeholder="https://tu-n8n.com/webhook/isochrone">
    </div>

  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ---- Configuración: pon aquí la URL de tu webhook por defecto ----
  const DEFAULT_WEBHOOK_URL = "https://TU-N8N.com/webhook/isochrone";

  const map = L.map('map').setView([4.65, -74.1], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  const durationInput = document.getElementById('duration');
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('generar');
  const webhookUrlInput = document.getElementById('webhookUrl');
  const baseListEl = document.getElementById('baseList');

  webhookUrlInput.value = localStorage.getItem('isochrone_webhook_url') || DEFAULT_WEBHOOK_URL;

  document.getElementById('toggleConfig').addEventListener('click', () => {
    const f = document.getElementById('webhookField');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  });

  // ---- Bases: cada una con su propio color, checkbox y capa en el mapa ----
  let bases = [
    { id: 'base1', name: 'Base 1 · Suba/Usaquén', lat: 4.7093, lon: -74.0688, color: '#F15A2B', active: true, layer: null, marker: null },
    { id: 'base2', name: 'Base 2 · Kennedy/P.Aranda', lat: 4.6245, lon: -74.1340, color: '#279bb0', active: true, layer: null, marker: null },
  ];
  let customCounter = 0;

  function renderBaseList() {
    baseListEl.innerHTML = '';
    bases.forEach(b => {
      const row = document.createElement('div');
      row.className = 'base-row';
      row.innerHTML = `
        <input type="checkbox" ${b.active ? 'checked' : ''} data-id="${b.id}" class="baseActive">
        <span class="swatch" style="background:${b.color}"></span>
        <div class="info">
          <div class="name">${b.name}</div>
          <div class="coords">
            <input type="text" value="${b.lat}" data-id="${b.id}" data-field="lat" class="baseCoord">
            <input type="text" value="${b.lon}" data-id="${b.id}" data-field="lon" class="baseCoord">
          </div>
        </div>
        ${b.custom ? `<span class="remove" data-id="${b.id}">✕</span>` : ''}
      `;
      baseListEl.appendChild(row);
    });

    baseListEl.querySelectorAll('.baseActive').forEach(cb => {
      cb.addEventListener('change', e => {
        const b = bases.find(x => x.id === e.target.dataset.id);
        b.active = e.target.checked;
        if (!b.active && b.layer) { map.removeLayer(b.layer); b.layer = null; }
        if (!b.active && b.marker) { map.removeLayer(b.marker); b.marker = null; }
      });
    });
    baseListEl.querySelectorAll('.baseCoord').forEach(inp => {
      inp.addEventListener('change', e => {
        const b = bases.find(x => x.id === e.target.dataset.id);
        b[e.target.dataset.field] = parseFloat(e.target.value);
      });
    });
    baseListEl.querySelectorAll('.remove').forEach(r => {
      r.addEventListener('click', e => {
        const id = e.target.dataset.id;
        const b = bases.find(x => x.id === id);
        if (b.layer) map.removeLayer(b.layer);
        if (b.marker) map.removeLayer(b.marker);
        bases = bases.filter(x => x.id !== id);
        renderBaseList();
      });
    });
  }

  document.getElementById('addCustomBtn').addEventListener('click', () => {
    customCounter++;
    const palette = ['#ffb000', '#9fd1a4', '#7c5cff', '#e0578a'];
    bases.push({
      id: 'custom' + customCounter,
      name: 'Personalizada ' + customCounter,
      lat: 4.65, lon: -74.1,
      color: palette[(customCounter - 1) % palette.length],
      active: true, custom: true, layer: null, marker: null
    });
    renderBaseList();
  });

  renderBaseList();

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  async function generarUnaBase(b, minutes, webhookUrl) {
    const resp = await fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat: b.lat, lon: b.lon, duration: Math.round(minutes * 60) })
    });
    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(`${b.name}: HTTP ${resp.status}: ${text.slice(0, 150)}`);
    }
    const geoJson = await resp.json();

    if (b.layer) map.removeLayer(b.layer);
    if (b.marker) map.removeLayer(b.marker);

    b.layer = L.geoJSON(geoJson, {
      style: { color: b.color, weight: 2, fillColor: b.color, fillOpacity: 0.25 }
    }).addTo(map);
    b.marker = L.circleMarker([b.lat, b.lon], {
      radius: 6, color: 'white', weight: 2, fillColor: b.color, fillOpacity: 1
    }).addTo(map).bindTooltip(b.name, { permanent: false });
  }

  async function generarIsochrone() {
    const minutes = parseFloat(durationInput.value);
    const webhookUrl = webhookUrlInput.value.trim();
    const activas = bases.filter(b => b.active);

    if (!webhookUrl || webhookUrl.includes('TU-N8N')) {
      setStatus('Configura primero la URL del webhook (⚙️ arriba).', 'error');
      document.getElementById('webhookField').style.display = 'block';
      return;
    }
    if (activas.length === 0) { setStatus('Activa al menos una base.', 'error'); return; }
    localStorage.setItem('isochrone_webhook_url', webhookUrl);

    btn.disabled = true;
    setStatus(`Consultando ${activas.length} base(s)... esto puede tardar unos segundos.`, '');

    try {
      const results = await Promise.allSettled(activas.map(b => generarUnaBase(b, minutes, webhookUrl)));
      const errores = results.filter(r => r.status === 'rejected');

      const allLayers = bases.filter(b => b.layer).map(b => b.layer);
      if (allLayers.length) {
        const group = L.featureGroup(allLayers);
        map.fitBounds(group.getBounds(), { padding: [30, 30] });
      }

      if (errores.length) {
        setStatus('Algunas bases fallaron: ' + errores.map(e => e.reason.message).join(' | '), 'error');
      } else {
        setStatus(`Listo — ${activas.length} base(s) generadas para ${minutes} min.`, 'ok');
      }
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', generarIsochrone);
</script>

</body>
</html>
